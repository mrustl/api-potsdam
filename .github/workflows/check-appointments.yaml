# Checks the booking calendar of the API Potsdam for free appointments and
# sends a Pushover notification and/or an e-mail about new ones.
#
# Repository secrets (Settings -> Secrets and variables -> Actions) for
# Pushover:
#   PUSHOVER_USER: Pushover user key
#   PUSHOVER_APP:  API token of a Pushover application
#
# and/or for e-mail (e.g. IONOS):
#   SMTP_SERVER:   e.g. smtp.ionos.de
#   SMTP_PORT:     optional, 465 (SSL/TLS, default) or 587 (STARTTLS)
#   SMTP_USER:     login, e.g. the e-mail address
#   SMTP_PASSWORD: password
#   EMAIL_FROM:    optional sender (default: SMTP_USER)
#   EMAIL_TO:      recipient(s), comma separated
#
# Optional repository secrets (kept as secrets, so that the public workflow
# logs do not show what is checked):
#   API_POTSDAM_EVENT_TYPE: appointment type(s), comma separated, e.g. the
#                           slug or samedi id (default: D)
#   API_POTSDAM_INSURANCE:  health insurance (default: gesetzlich)
#
# Optional repository variable:
#   API_POTSDAM_PRIORITY: Pushover priority, -2 to 2 (default: 1). With 2
#                         (emergency) the notification repeats every 60 s
#                         until acknowledged (for at most one hour).
#
# The logs and the job summary only show the number of free appointments.
# The details are sent with Pushover or by e-mail.

name: check-appointments

on:
  schedule:
    # every 6 minutes, not at the full hour (runs may start some minutes late)
    - cron: '3-59/6 * * * *'
  workflow_dispatch:
    inputs:
      test_notification:
        description: 'Zuerst eine Testnachricht senden (Pushover und/oder E-Mail)'
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: check-appointments
  cancel-in-progress: false

jobs:
  # Skip the check (with a warning instead of a failure every few minutes) as
  # long as neither Pushover nor e-mail is set up. Only run on the default
  # branch: scheduled runs always do, and the state of notified appointments
  # is only shared within the cache scope of the default branch.
  configuration:
    if: github.event_name == 'schedule' || github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-24.04
    outputs:
      pushover: ${{ steps.channels.outputs.pushover }}
      email: ${{ steps.channels.outputs.email }}
    steps:
      - name: Check notification secrets
        id: channels
        env:
          PUSHOVER_USER: ${{ secrets.PUSHOVER_USER }}
          PUSHOVER_APP: ${{ secrets.PUSHOVER_APP }}
          SMTP_SERVER: ${{ secrets.SMTP_SERVER }}
          EMAIL_TO: ${{ secrets.EMAIL_TO }}
        run: |
          pushover=false
          email=false
          if [ -n "$PUSHOVER_USER" ] || [ -n "$PUSHOVER_APP" ]; then pushover=true; fi
          if [ -n "$SMTP_SERVER" ] || [ -n "$EMAIL_TO" ]; then email=true; fi
          if [ "$pushover" = false ] && [ "$email" = false ]; then
            echo "::warning::Neither Pushover (PUSHOVER_USER, PUSHOVER_APP) nor e-mail (SMTP_SERVER, EMAIL_TO, ...) secrets are set, no check. See README."
          fi
          echo "pushover=$pushover" >> "$GITHUB_OUTPUT"
          echo "email=$email" >> "$GITHUB_OUTPUT"

  check-appointments:
    needs: configuration
    if: needs.configuration.outputs.pushover == 'true' || needs.configuration.outputs.email == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    env:
      PUSHOVER_USER: ${{ secrets.PUSHOVER_USER }}
      PUSHOVER_APP: ${{ secrets.PUSHOVER_APP }}
      SMTP_SERVER: ${{ secrets.SMTP_SERVER }}
      SMTP_PORT: ${{ secrets.SMTP_PORT }}
      SMTP_USER: ${{ secrets.SMTP_USER }}
      SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
      EMAIL_FROM: ${{ secrets.EMAIL_FROM }}
      EMAIL_TO: ${{ secrets.EMAIL_TO }}
      SEND_PUSHOVER: ${{ needs.configuration.outputs.pushover }}
      SEND_EMAIL: ${{ needs.configuration.outputs.email }}
      API_POTSDAM_EVENT_TYPE: ${{ secrets.API_POTSDAM_EVENT_TYPE || 'D' }}
      API_POTSDAM_INSURANCE: ${{ secrets.API_POTSDAM_INSURANCE || 'gesetzlich' }}
      API_POTSDAM_PRIORITY: ${{ vars.API_POTSDAM_PRIORITY || '1' }}
      STATE_FILE: .state/notified-appointments.txt
      # UTF-8 locale, so that umlauts in messages and the job summary survive
      LANG: C.UTF-8
      LC_ALL: C.UTF-8

    steps:
      - uses: actions/checkout@v7

      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          dependencies: '"hard"'
          extra-packages: local::.

      # Appointments that a notification was already sent for. The cache key
      # does not depend on the settings (the keys stored in the file contain
      # the samedi id of the appointment type), so it does not reveal them.
      - name: Restore notified appointments
        uses: actions/cache/restore@v6
        with:
          path: .state
          key: notified-appointments-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: notified-appointments-

      - name: Send test notification
        if: ${{ inputs.test_notification }}
        run: |
          if (Sys.getenv("SEND_PUSHOVER") == "true") api.potsdam::send_test_notification()
          if (Sys.getenv("SEND_EMAIL") == "true") api.potsdam::send_test_email()
        shell: Rscript {0}

      - name: Check for free appointments
        id: check
        run: |
          state_file <- Sys.getenv("STATE_FILE")
          md5 <- function(file) {
            if (file.exists(file)) unname(tools::md5sum(file)) else NA_character_
          }
          state_before <- md5(state_file)

          appointments <- api.potsdam::check_appointments(
            event_type = trimws(strsplit(Sys.getenv("API_POTSDAM_EVENT_TYPE"), ",")[[1L]]),
            insurance = Sys.getenv("API_POTSDAM_INSURANCE"),
            send_pushover_notification = Sys.getenv("SEND_PUSHOVER") == "true",
            send_email_notification = Sys.getenv("SEND_EMAIL") == "true",
            state_file = state_file,
            priority = Sys.getenv("API_POTSDAM_PRIORITY", "1"),
            dbg = FALSE
          )

          # Only counts in the public log, no appointment types or times
          n_new <- sum(appointments$is_new)
          message(sprintf(
            "%d free appointment(s), %d new%s",
            nrow(appointments),
            n_new,
            if (n_new > 0L) " (notification sent)" else ""
          ))

          # Save the state only if it changed (keeps the number of caches small)
          cat(
            sprintf("state_changed=%s\n", tolower(!identical(state_before, md5(state_file)))),
            file = Sys.getenv("GITHUB_OUTPUT"),
            append = TRUE
          )

          # Job summary (public): only counts
          cat(
            sprintf(
              "## API Potsdam\n\nFreie Termine: %d, davon neu: %d\n",
              nrow(appointments),
              n_new
            ),
            file = Sys.getenv("GITHUB_STEP_SUMMARY"),
            append = TRUE
          )

          # One channel failed (the other one worked): fail the run, so that
          # GitHub reports it, but still save the state (step below)
          failed <- attr(appointments, "failed_channels")
          if (length(failed) > 0L) {
            message("::error::Notification failed for: ", paste(failed, collapse = ", "))
            quit(status = 1L)
          }
        shell: Rscript {0}

      - name: Save notified appointments
        if: always() && steps.check.outputs.state_changed == 'true'
        uses: actions/cache/save@v6
        with:
          path: .state
          key: notified-appointments-${{ github.run_id }}-${{ github.run_attempt }}
